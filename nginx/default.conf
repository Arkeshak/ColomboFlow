server {
    listen 80;

    location / {
        proxy_pass http://client:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        # Rewrite to drop the /api/ prefix if needed, 
        # or leave as is if server handles /api prefix. 
        # Since our server mounts on root, we drop /api
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /ml/ {
        rewrite ^/ml/(.*) /$1 break;
        proxy_pass http://ml:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Optional: routing for websockets if needed, generally handled above for /api/
}
